version: '3.9'

services:
  database:
    build:
      context: ./database
    container_name: microservice_database_container
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./db_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      retries: 5

  service-a:
    build:
      context: ./service-a
    container_name: service_a_container
    depends_on:
      - database
    env_file:
      - .env
    command: ["python", "main.py", "--protocol", "REST"]
    ports:
      - "8000:8000"

  service-b:
    build:
      context: ./service-b
    container_name: service_b_container
    depends_on:
      - service-a
    env_file:
      - .env
    command: ["python", "main.py"]