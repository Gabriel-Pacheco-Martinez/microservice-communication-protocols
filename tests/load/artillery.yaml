config:
  target: "http://localhost:8080"   # Replace with your Service A URL
  phases:
    - duration: 30       # Run for 60 seconds
      arrivalRate: 1     # Start 5 requests per second
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Generic Microservice Load Test"
    weight: 3
    flow:
      - post:
          url: "/request"
          json:
            protocol: "gRPC"
            operation: "getUsers"
            payload:  {}

  - name: "Add User Load Test"
    weight: 1
    flow:
      - post:
          url: "/request"
          json:
            protocol: "gRPC"
            operation: "addUser"
            payload:
              name: "Charlie"
              email: "charlie@example.com"
